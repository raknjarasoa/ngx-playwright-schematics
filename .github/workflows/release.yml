name: Publish to NPM

on:
  push:
    branches: [main]
  release:
    types: [created, published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Build package & bundle assets
        run: npm run build

      - name: Check if version needs publishing
        id: check-version
        run: |
          LOCAL_VERSION=$(node -p "require('./package.json').version")
          NPM_VERSION=$(npm view ngx-playwright-schematics version 2>/dev/null || echo "0.0.0")
          echo "Local version: $LOCAL_VERSION"
          echo "NPM version:   $NPM_VERSION"
          if [ "$LOCAL_VERSION" != "$NPM_VERSION" ]; then
            echo "should_publish=true" >> $GITHUB_OUTPUT
            echo "🚀 New version detected ($LOCAL_VERSION). Publishing to NPM..."
          else
            echo "should_publish=false" >> $GITHUB_OUTPUT
            echo "ℹ️ Version $LOCAL_VERSION is already published on NPM. Skipping publish."
          fi

      - name: Publish to NPM via OIDC Trusted Publishing
        if: steps.check-version.outputs.should_publish == 'true'
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
